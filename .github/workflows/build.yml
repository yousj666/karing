name: Build

# First installable builds of the Yousj Enhanced fork.
# Android (v1.0.8+): release builds are signed with a fixed long-term
# release key. The keystore lives only in GitHub Secrets
# (YOUSJ_KEYSTORE_BASE64 / _PASSWORD / _ALIAS / _KEY_PASSWORD); the
# workflow decodes it to the runner temp dir and Gradle picks it up via
# YOUSJ_KEYSTORE_* (see android/app/build.gradle.kts). A post-build step
# verifies the APK cert fingerprint, so a tag build can never silently
# fall back to a throwaway debug key again — that fallback is what made
# 1.0.2-1.0.7 mutually uninstallable as overlay upgrades.

on:
  workflow_dispatch:
  push:
    tags: ['yousj-v*']

jobs:
  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Flutter
        # Pinned to the toolchain this tree declares: pubspec floor is
        # Flutter >=3.44.0 with Dart >=3.12.2, settings.gradle.kts
        # carries AGP 8.11.1 / Kotlin 2.2.20 and the wrapper is Gradle
        # 8.14.3. Latest stable (3.50-era) refuses to build: its Gradle
        # plugin requires Gradle >= 9.3.1, which would force an AGP 9
        # migration. Within the 3.44 line, Dart tops out at 3.12.2 and
        # its pinned meta (1.18.0) cannot satisfy the exact sqlite3
        # 3.7.0 pin in pubspec.yaml (needs meta ^1.19.0), so version
        # solving fails there too. 3.47.9 (Dart 3.13.7) is the newest
        # line whose meta pin fits and whose Gradle floor still
        # accepts this tree's Gradle 8.14.3 wrapper.
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: '3.47.9'
          cache: true

      - name: Compute build version
        # AppUtils.getBuildinVersion() reads KARING_BUILD_VERSION at compile
        # time, and main.dart refuses to start (invalidVersion) unless it
        # equals the package version in dotted-quad form. Derive it from
        # pubspec.yaml (X.Y.Z+B -> X.Y.Z.B) so the two can never drift.
        run: |
          v=$(grep -E '^version:' pubspec.yaml | head -1 | sed -E 's/^version:[[:space:]]*//; s/\+/./')
          echo "KARING_BUILD_VERSION=$v" >> "$GITHUB_ENV"
          echo "Build version: $v"

      - name: Unpin Windows-only JDK path
        # android/gradle.properties pins org.gradle.java.home to a Windows
        # path for the upstream author's local setup; that path does not
        # exist on Linux runners and Gradle refuses to start.
        run: sed -i '/^org.gradle.java.home=/d' android/gradle.properties

      - name: Decode release keystore
        # v1.0.8: decode the fixed release keystore from GitHub Secrets
        # into the runner temp dir (never into the checkout) and point
        # Gradle at it via YOUSJ_KEYSTORE_PATH; the passwords/alias are
        # handed to the build step directly from secrets. Fail hard when
        # any secret is missing: a tag build must never drift back to a
        # per-run debug key.
        env:
          YOUSJ_KEYSTORE_BASE64: ${{ secrets.YOUSJ_KEYSTORE_BASE64 }}
          YOUSJ_KEYSTORE_PASSWORD: ${{ secrets.YOUSJ_KEYSTORE_PASSWORD }}
          YOUSJ_KEY_ALIAS: ${{ secrets.YOUSJ_KEY_ALIAS }}
          YOUSJ_KEY_PASSWORD: ${{ secrets.YOUSJ_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          for v in YOUSJ_KEYSTORE_BASE64 YOUSJ_KEYSTORE_PASSWORD YOUSJ_KEY_ALIAS YOUSJ_KEY_PASSWORD; do
            if [ -z "${!v}" ]; then echo "::error::Missing required secret: $v"; exit 1; fi
          done
          dir="$RUNNER_TEMP/yousj-signing"
          mkdir -p "$dir"
          echo "$YOUSJ_KEYSTORE_BASE64" | base64 -d > "$dir/yousj-release.jks"
          echo "YOUSJ_KEYSTORE_PATH=$dir/yousj-release.jks" >> "$GITHUB_ENV"
          echo "Release keystore decoded to $dir/yousj-release.jks"

      - name: Bundle official Termux APK (pinned)
        # yousj-plus (v1.0.6): the home-grid Termux entry installs Termux
        # from a bundled asset when the user has none. This downloads the
        # official termux-app GitHub Release build (arm64-v8a) into the
        # Android assets at build time — the 35 MB binary is deliberately
        # NOT committed to git. Version and SHA-256 are pinned; the
        # digest comes from the release's own sha256sums file and was
        # re-verified against the file itself. A checksum mismatch (or a
        # failed download) fails the build instead of shipping an
        # unverified binary.
        run: |
          set -euo pipefail
          version="0.118.3"
          sha256="72fdb596045116bf5ba1b5bdf5b26fddb9acc0bd074ad9f2da9eb0ae85e83a4e"
          url="https://github.com/termux/termux-app/releases/download/v${version}/termux-app_v${version}+github-debug_arm64-v8a.apk"
          dest="android/app/src/main/assets/termux/termux-app-arm64.apk"
          mkdir -p "$(dirname "$dest")"
          curl -fL --retry 3 -o "$dest" "$url"
          echo "${sha256}  ${dest}" | sha256sum -c -
          ls -la "$dest"

      - name: Bundle frpc (pinned)
        # yousj-plus (v1.0.7): the built-in reverse tunnel runs frpc
        # (fatedier/frp). The official linux/arm64 release tarball is
        # downloaded at build time; its SHA-256 below is the value from
        # the release's own frp_sha256_checksums.txt, re-verified
        # against the downloaded file (and the extracted frpc binary's
        # digest is checked as well). The binary is placed as a JNI
        # library — lib/arm64-v8a/libfrpc.so — because Android 10+ will
        # not execute binaries extracted into the app's data directory,
        # while the native library directory stays executable. A
        # checksum mismatch (or a failed download) fails the build
        # instead of shipping an unverified binary. Not committed to git.
        run: |
          set -euo pipefail
          version="0.62.1"
          tarball_sha256="94c98c19ce181f8e09e0d0cb79c278c31e9ec936eb713826a1ddf4995e7c2155"
          frpc_sha256="3f900ac9b035aac50b117ce5f7c450ca073d3e453448783979e978dc57bc39a9"
          url="https://github.com/fatedier/frp/releases/download/v${version}/frp_${version}_linux_arm64.tar.gz"
          work="$(mktemp -d)"
          curl -fL --retry 3 -o "$work/frp.tar.gz" "$url"
          echo "${tarball_sha256}  $work/frp.tar.gz" | sha256sum -c -
          tar --no-same-owner -xzf "$work/frp.tar.gz" -C "$work"
          dest="android/app/src/main/jniLibs/arm64-v8a/libfrpc.so"
          mkdir -p "$(dirname "$dest")"
          cp "$work/frp_${version}_linux_arm64/frpc" "$dest"
          chmod 755 "$dest"
          echo "${frpc_sha256}  ${dest}" | sha256sum -c -
          ls -la "$dest"

      - name: Build release APK
        env:
          YOUSJ_KEYSTORE_PASSWORD: ${{ secrets.YOUSJ_KEYSTORE_PASSWORD }}
          YOUSJ_KEY_ALIAS: ${{ secrets.YOUSJ_KEY_ALIAS }}
          YOUSJ_KEY_PASSWORD: ${{ secrets.YOUSJ_KEY_PASSWORD }}
        run: flutter build apk --release --dart-define=KARING_BUILD_VERSION=${{ env.KARING_BUILD_VERSION }}

      - name: Verify release signature
        # Gate: every produced APK must carry the fixed release key.
        # The expected value is the public SHA-256 fingerprint of the
        # long-term certificate (first used in v1.0.8); it is not a secret.
        run: |
          set -euo pipefail
          expected="066328ac6c2e3f6199072fb3a0e9e58e81cc056d95b5e204cac6343f789139a7"
          apksigner="$(ls "$ANDROID_HOME"/build-tools/*/apksigner | sort -V | tail -1)"
          for apk in build/app/outputs/flutter-apk/*.apk; do
            digest="$("$apksigner" verify --print-certs "$apk" | grep 'SHA-256 digest' | head -1 | sed 's/.*: //' | tr -d ' :' | tr '[:upper:]' '[:lower:]')"
            echo "$apk -> $digest"
            if [ "$digest" != "$expected" ]; then
              echo "::error::$apk is signed with an unexpected certificate"
              exit 1
            fi
          done
          echo "## Android signing" >> "$GITHUB_STEP_SUMMARY"
          echo "Release-signed with the fixed Yousj key (cert SHA-256: $expected)." >> "$GITHUB_STEP_SUMMARY"
          ls -la build/app/outputs/flutter-apk/ >> "$GITHUB_STEP_SUMMARY" || true

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: YousjEnhanced-android
          path: build/app/outputs/flutter-apk/*.apk
          if-no-files-found: error

  windows:
    # VS2022-era image: windows-latest now ships VS 18 / MSVC 14.51,
    # whose STL hard-errors on <experimental/coroutine> (STL1011) used
    # by the third-party flutter_inappwebview_windows plugin.
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Compute build version
        # Same KARING_BUILD_VERSION plumbing as the android job: derive the
        # dotted-quad form from pubspec.yaml (X.Y.Z+B -> X.Y.Z.B).
        shell: pwsh
        run: |
          $line = Get-Content pubspec.yaml | Where-Object { $_ -match '^version:' } | Select-Object -First 1
          $v = ($line -replace '^version:\s*', '') -replace '\+', '.'
          echo "KARING_BUILD_VERSION=$v" >> $env:GITHUB_ENV
          Write-Host "Build version: $v"

      - name: Build Windows release
        run: flutter build windows --release --dart-define=KARING_BUILD_VERSION=${{ env.KARING_BUILD_VERSION }}

      - name: Zip release bundle
        shell: pwsh
        run: Compress-Archive -Path build/windows/x64/runner/Release/* -DestinationPath YousjEnhanced-windows.zip

      - name: Upload bundle
        uses: actions/upload-artifact@v4
        with:
          name: YousjEnhanced-windows
          path: YousjEnhanced-windows.zip
          if-no-files-found: error
