name: Analyze

# First-pass static analysis for the yousj-plus reconstruction.
# The tree is known to be incomplete (upstream partial source release);
# this workflow's job is to produce the true analyzer error list that
# drives the reconstruction fix queue. It is expected to be RED until
# the missing layer is fully rebuilt — do not add continue-on-error.
# App and plugin are separate jobs so one side's failure never hides
# the other side's results.

on:
  push:
    branches: [yousj-plus]
  pull_request:
  workflow_dispatch:

jobs:
  analyze-app:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Flutter version
        run: flutter --version

      - name: Pub get
        run: flutter pub get

      - name: Analyze
        # Errors stay fatal. The remaining ~200 warnings/infos are
        # upstream's own (deprecated material-shim uses, naming lints);
        # they must not mask the error signal.
        run: flutter analyze --no-fatal-warnings

  analyze-plugin:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: vpn-service
    steps:
      - uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Pub get
        run: flutter pub get

      - name: Analyze
        run: flutter analyze
