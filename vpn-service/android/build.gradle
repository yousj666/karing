group 'io.nebula.vpn_service'
version '1.0'

buildscript {
    ext.kotlin_version = '2.1.0'
    repositories {
        google()
        mavenCentral()
    }
    dependencies {
        classpath 'com.android.tools.build:gradle:8.7.3'
        classpath "org.jetbrains.kotlin:kotlin-gradle-plugin:$kotlin_version"
    }
}

allprojects {
    repositories {
        google()
        mavenCentral()
    }
}

apply plugin: 'com.android.library'
apply plugin: 'kotlin-android'

android {
    namespace 'io.nebula.vpn_service'
    compileSdk 35

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_11
        targetCompatibility JavaVersion.VERSION_11
    }

    kotlinOptions {
        jvmTarget = JavaVersion.VERSION_11
    }

    sourceSets {
        main.java.srcDirs += 'src/main/kotlin'
    }

    defaultConfig {
        minSdk 24
    }
}

// R4: the sing-box core (gomobile-built libbox.aar from KaringX/sing-box,
// Java package io.nekohasekai.libbox — see the design doc
// goals/karing-fork/hidden_files/r4-native-design.md §1.3 and §5 step 1).
// Drop libbox.aar into android/libs/ and uncomment:
//
// dependencies {
//     implementation files("libs/libbox.aar")
// }
//
// Until then LibboxBridge.kt runs stubbed and starts report
// "libbox core not built yet (R4-CORE)".
